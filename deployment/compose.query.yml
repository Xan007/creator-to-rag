services:
  query:
    build:
      context: ..
      target: query
    env_file: ${QUERY_ENV_FILE:-.env.query}
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      - query-state:/app/state
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  query-state:
