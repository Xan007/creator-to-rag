services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: ingest
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./.env:/app/.env
      - ./data:/app/data
      - crag-state:/app/state
      - ./src:/app/src
      - ./storage:/app/storage
      - ./config:/app/config
    environment:
      - CRAG_HOST=0.0.0.0
      - CRAG_PORT=8000
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Browser stays same-origin: Vite inside the container proxies /api to the
      # backend service. Override VITE_API_URL only if you want direct calls.
      - VITE_API_URL=/api
      - VITE_API_PROXY_TARGET=http://backend:8000
      # Bind mounts on Windows/macOS need polling for reliable HMR.
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  crag-state:
