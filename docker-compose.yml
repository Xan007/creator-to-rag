version: '3.8'

services:
  crag-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crag-api
    ports:
      - "${CRAG_PORT:-8000}:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - APIFY_API_KEY=${APIFY_API_KEY}
      - CRAG_DATABASE_URL=${CRAG_DATABASE_URL:-sqlite:////data/config/crag.db}
      - CRAG_API_KEY=${CRAG_API_KEY:-}
      - CRAG_CORS_ORIGINS=${CRAG_CORS_ORIGINS:-*}
    volumes:
      - crag_data:/data
    restart: unless-stopped

volumes:
  crag_data:
    driver: local
