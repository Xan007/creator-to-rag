[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "creatorrag"
version = "0.3.0"
description = "CreatorRAG (crag): turn selected Instagram and TikTok creator content into a personal knowledge library with cited RAG answers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apify-client>=3.1.3",
    "fastembed>=0.8.0",
    "faster-whisper>=1.2.1",
    "google-genai>=2.19.0",
    "openai>=3.3.1",
    "pinecone>=9.1.0",
    "python-dotenv>=1.2.3",
    "rank-bm25>=0.2.2",
    "reportlab>=5.0.1",
    "requests>=2.32.0",
    "rich>=14.0.0",
    "sqlalchemy>=2.0",
    "typer>=0.27.1",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
crag = "main:main"
crag-api = "src.api.main:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "alembic>=1.13",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[tool.setuptools]
py-modules = ["main", "api"]

[tool.setuptools.packages.find]
include = ["src*", "config*", "storage*"]
